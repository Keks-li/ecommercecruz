services:
  - type: web
    name: cruzaro-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false   # Supabase Transaction pooler URL: postgresql://postgres.nmknkskyzmlocnjbrtub:<password>@aws-0-eu-west-2.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false   # cloudinary://<api_key>:<api_secret>@qfpjrjxc
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://cruzaro.pages.dev,https://*.pages.dev,http://localhost:3000
      - key: PAYSTACK_SECRET_KEY
        sync: false   # sk_live_... or sk_test_...
      - key: PAYSTACK_PUBLIC_KEY
        sync: false   # pk_live_... or pk_test_...
      - key: PAYSTACK_CALLBACK_URL
        sync: false   # https://cruzaro.pages.dev/profile
    healthCheckPath: /api/health
